name: Attach Debug APKs To Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v0.118.0-material-you)'
        required: true
        default: 'v0.118.0-material-you'

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE_VARIANT: apt-android-7

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || env.GITHUB_REF }}

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and attach APKs to release
        shell: bash {0}
        run: |
          set -e
          echo "Setting release variables"
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
              RELEASE_VERSION_NAME="${{ github.event.inputs.release_tag }}"
          else
              RELEASE_VERSION_NAME="${GITHUB_REF/refs\/tags\//}"
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME+${PACKAGE_VARIANT}-github-debug"
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          echo "Building APKs on GitHub Actions runner..."
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${PACKAGE_VARIANT}"
          ./gradlew assembleDebug

          echo "Preparing short clean filenames..."
          UPLOAD_DIR="./release_assets"
          mkdir -p "$UPLOAD_DIR"

          cp "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" "$UPLOAD_DIR/termux-arm64.apk"
          cp "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_universal.apk" "$UPLOAD_DIR/termux-universal.apk"
          cp "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_armeabi-v7a.apk" "$UPLOAD_DIR/termux-armeabi-v7a.apk"
          cp "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86_64.apk" "$UPLOAD_DIR/termux-x86_64.apk"
          cp "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_x86.apk" "$UPLOAD_DIR/termux-x86.apk"

          cd "$UPLOAD_DIR"
          sha256sum termux-*.apk > SHA256SUMS.txt

          echo "Uploading assets directly from GitHub data center to Release..."
          gh release upload "$RELEASE_VERSION_NAME" \
            termux-arm64.apk \
            termux-universal.apk \
            termux-armeabi-v7a.apk \
            termux-x86_64.apk \
            termux-x86.apk \
            SHA256SUMS.txt \
            --clobber
